# NANOFreeDisk rule pack: AI assistants / coding agents
# Schema: see docs/DEVTOOL_CACHE_CATALOG.md and crates/nfd-rules/src/schema.rs
# level: safe | caution | advanced | protected
# Path variables: ${HOME} ${USERPROFILE} ${APPDATA} ${LOCALAPPDATA} ${PROGRAMDATA} ${TEMP} ${SYSTEMROOT}

[pack]
id          = "ai-tools"
name        = "AI assistants & coding agents"
version     = "0.1.0"
description = "Caches, logs and session data of Claude, Codex, Gemini CLI, Copilot, Cursor, Windsurf, Continue, Cline, Ollama and friends."
devcache    = true

# ───────────────────────────── Anthropic ─────────────────────────────

[[rule]]
id              = "anthropic.claude-code.config"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude.json", "${HOME}/.claude/settings.json", "${HOME}/.claude/settings.local.json"]
level           = "protected"
impact          = "Global config, OAuth state and permissions. Deleting forces re-login and loses all settings."
impact_vi       = "Cấu hình chung, trạng thái OAuth và quyền. Xóa sẽ phải đăng nhập lại và mất mọi thiết lập."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.sessions"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/projects/**", "${HOME}/.claude/sessions/**", "${HOME}/.claude/history.jsonl"]
level           = "protected"
impact          = "Conversation transcripts used by `claude --resume` / `--continue`, per-project memory and prompt history. Conversation history is never deleted (PLAN §5.1)."
impact_vi       = "Bản ghi hội thoại dùng cho `claude --resume` / `--continue`, bộ nhớ theo dự án và lịch sử prompt. Lịch sử hội thoại không bao giờ bị xóa (PLAN §5.1)."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.memory"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/projects/*/memory/**"]
level           = "protected"
impact          = "Per-project auto-memory. Deleting loses everything Claude Code learned about the project."
impact_vi       = "Bộ nhớ tự động theo dự án. Xóa sẽ mất mọi điều Claude Code đã học về dự án."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.todos"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/todos/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
requires_closed = ["claude.exe", "claude"]
impact          = "Temporary per-session todo lists."
impact_vi       = "Danh sách việc cần làm tạm thời của từng phiên."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.shell-snapshots"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/shell-snapshots/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
requires_closed = ["claude.exe", "claude"]
impact          = "Shell environment snapshots; recreated on next session."
impact_vi       = "Ảnh chụp môi trường shell; được tạo lại ở phiên sau."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.logs"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/debug/**", "${HOME}/.claude/logs/**", "${HOME}/.claude/statsig/**", "${HOME}/.claude/telemetry/**"]
level           = "safe"
regenerates     = true
impact          = "Debug logs and feature-flag cache. You lose logs that could help report a bug."
impact_vi       = "Nhật ký gỡ lỗi và bộ đệm feature flag. Bạn mất nhật ký có thể giúp báo lỗi."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.file-history"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/file-history/**"]
level           = "caution"
regenerates     = false
min_age_days    = 30
requires_closed = ["claude.exe", "claude"]
impact          = "Pre-edit copies of files used to revert Claude Code edits. Old entries are rarely needed."
impact_vi       = "Bản sao tệp trước khi sửa, dùng để hoàn tác thay đổi của Claude Code. Mục cũ hiếm khi cần."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-code.extensions"
vendor          = "Anthropic"
app             = "Claude Code"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.claude/plugins/**", "${HOME}/.claude/skills/**", "${HOME}/.claude/commands/**", "${HOME}/.claude/agents/**"]
level           = "protected"
impact          = "User-installed plugins, skills, commands and agents."
impact_vi       = "Plugin, skill, lệnh và agent do người dùng cài."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-desktop.cache"
vendor          = "Anthropic"
app             = "Claude Desktop"
category        = "ai-app"
platform        = ["windows"]
paths           = [
  "${APPDATA}/Claude/Cache/**", "${APPDATA}/Claude/Code Cache/**", "${APPDATA}/Claude/GPUCache/**",
  "${APPDATA}/Claude/DawnCache/**", "${APPDATA}/Claude/DawnGraphiteCache/**", "${APPDATA}/Claude/DawnWebGPUCache/**",
  "${APPDATA}/Claude/Service Worker/CacheStorage/**", "${APPDATA}/Claude/logs/**", "${APPDATA}/Claude/Crashpad/**",
  "${LOCALAPPDATA}/AnthropicClaude/packages/*.nupkg", "${LOCALAPPDATA}/AnthropicClaude/*.log",
]
level           = "safe"
regenerates     = true
requires_closed = ["Claude.exe"]
impact          = "Chromium/Electron caches and logs; the app rebuilds them and may open slightly slower once."
impact_vi       = "Bộ đệm và nhật ký Chromium/Electron; ứng dụng tự tạo lại và có thể mở chậm hơn một lần."
verified_on     = 2026-10-16

[[rule]]
id              = "anthropic.claude-desktop.config"
vendor          = "Anthropic"
app             = "Claude Desktop"
category        = "ai-app"
platform        = ["windows"]
paths           = ["${APPDATA}/Claude/claude_desktop_config.json", "${APPDATA}/Claude/Local Storage/**", "${APPDATA}/Claude/IndexedDB/**"]
level           = "protected"
impact          = "MCP configuration and login state."
impact_vi       = "Cấu hình MCP và trạng thái đăng nhập."
verified_on     = 2026-10-16

# ───────────────────────────── OpenAI ─────────────────────────────

[[rule]]
id              = "openai.codex.config"
vendor          = "OpenAI"
app             = "Codex CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.codex/auth.json", "${HOME}/.codex/config.toml", "${HOME}/.codex/instructions.md", "${HOME}/.codex/AGENTS.md"]
level           = "protected"
impact          = "Credentials and configuration."
impact_vi       = "Thông tin đăng nhập và cấu hình."
verified_on     = 2026-10-16

[[rule]]
id              = "openai.codex.sessions"
vendor          = "OpenAI"
app             = "Codex CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.codex/sessions/**", "${HOME}/.codex/archived_sessions/**", "${HOME}/.codex/history.jsonl", "${HOME}/.codex/session_index.jsonl", "${HOME}/.codex/thread_history_*", "${HOME}/.codex/state_*", "${HOME}/.codex/memories/**", "${HOME}/.codex/memories_*", "${HOME}/.codex/attachments/**"]
level           = "protected"
impact          = "Session transcripts, thread history, memories and prompt history (used by `codex resume`). Conversation history is never deleted (PLAN §5.1)."
impact_vi       = "Bản ghi phiên, lịch sử thread, bộ nhớ và lịch sử prompt (dùng cho `codex resume`). Lịch sử hội thoại không bao giờ bị xóa (PLAN §5.1)."
verified_on     = 2026-10-16

[[rule]]
id              = "openai.codex.logs"
vendor          = "OpenAI"
app             = "Codex CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.codex/log/**", "${HOME}/.codex/*.log"]
level           = "safe"
regenerates     = true
impact          = "Log files only."
impact_vi       = "Chỉ là tệp nhật ký."
verified_on     = 2026-10-16

[[rule]]
id              = "openai.chatgpt-desktop.cache"
vendor          = "OpenAI"
app             = "ChatGPT Desktop"
category        = "ai-app"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Packages/OpenAI.ChatGPT-Desktop_*/LocalCache/**", "${LOCALAPPDATA}/Packages/OpenAI.ChatGPT-Desktop_*/TempState/**"]
level           = "safe"
regenerates     = true
requires_closed = ["ChatGPT.exe"]
impact          = "MSIX app cache; rebuilt on next launch."
impact_vi       = "Bộ đệm của ứng dụng MSIX; được tạo lại ở lần mở sau."
verified_on     = 2026-10-16

# ───────────────────────────── Google ─────────────────────────────

[[rule]]
id              = "google.gemini-cli.config"
vendor          = "Google"
app             = "Gemini CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.gemini/oauth_creds.json", "${HOME}/.gemini/settings.json", "${HOME}/.gemini/GEMINI.md", "${HOME}/.gemini/installation_id"]
level           = "protected"
impact          = "Credentials and configuration."
impact_vi       = "Thông tin đăng nhập và cấu hình."
verified_on     = 2026-10-16

[[rule]]
id              = "google.gemini-cli.chats"
vendor          = "Google"
app             = "Gemini CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.gemini/tmp/**"]
level           = "protected"
impact          = "Saved chats, checkpoints and logs of each project (`/chat resume`, `/restore`). Conversation history is never deleted (PLAN §5.1)."
impact_vi       = "Chat đã lưu, checkpoint và nhật ký của từng dự án (`/chat resume`, `/restore`). Lịch sử hội thoại không bao giờ bị xóa (PLAN §5.1)."
verified_on     = 2026-10-16

[[rule]]
id              = "google.gemini-cli.history"
vendor          = "Google"
app             = "Gemini CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.gemini/history/**"]
level           = "protected"
impact          = "Gemini CLI conversation history. Never deleted (PLAN §5.1)."
impact_vi       = "Lịch sử hội thoại của Gemini CLI. Không bao giờ bị xóa (PLAN §5.1)."
verified_on     = 2026-10-16

# ───────────────────────────── GitHub Copilot ─────────────────────────────

[[rule]]
id              = "github.copilot.auth"
vendor          = "GitHub"
app             = "Copilot"
category        = "ai-agent"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/github-copilot/**", "${HOME}/.copilot/config.json"]
level           = "protected"
impact          = "Tokens and host configuration; deleting forces re-login."
impact_vi       = "Token và cấu hình máy chủ; xóa sẽ phải đăng nhập lại."
verified_on     = 2026-10-16

[[rule]]
id              = "github.copilot.chat-history"
vendor          = "GitHub"
app             = "Copilot Chat (VS Code)"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
paths           = ["${APPDATA}/Code/User/globalStorage/github.copilot-chat/**", "${APPDATA}/Code/User/globalStorage/emptyWindowChatSessions/**", "${HOME}/.copilot/session-state/**", "${HOME}/.copilot/history-session-state/**"]
level           = "protected"
impact          = "Chat history inside VS Code / Copilot CLI. Conversation history is never deleted (PLAN §5.1)."
impact_vi       = "Lịch sử chat trong VS Code / Copilot CLI. Lịch sử hội thoại không bao giờ bị xóa (PLAN §5.1)."
verified_on     = 2026-10-16

# ───────────────────────────── Cursor ─────────────────────────────

[[rule]]
id              = "cursor.config"
vendor          = "Anysphere"
app             = "Cursor"
category        = "ai-ide"
platform        = ["windows"]
paths           = [
  "${APPDATA}/Cursor/User/settings.json", "${APPDATA}/Cursor/User/keybindings.json", "${APPDATA}/Cursor/User/snippets/**",
  "${APPDATA}/Cursor/User/globalStorage/state.vscdb*", "${HOME}/.cursor/extensions/**", "${HOME}/.cursor/mcp.json", "${HOME}/.cursor/rules/**",
]
level           = "protected"
impact          = "Settings, extensions, MCP config and the state DB that holds Cursor chat history."
impact_vi       = "Thiết lập, extension, cấu hình MCP và DB trạng thái chứa lịch sử chat của Cursor."
verified_on     = 2026-10-16

[[rule]]
id              = "cursor.cache"
vendor          = "Anysphere"
app             = "Cursor"
category        = "ai-ide"
platform        = ["windows"]
paths           = [
  "${APPDATA}/Cursor/Cache/**", "${APPDATA}/Cursor/CachedData/**", "${APPDATA}/Cursor/CachedExtensionVSIXs/**",
  "${APPDATA}/Cursor/CachedProfilesData/**", "${APPDATA}/Cursor/Code Cache/**", "${APPDATA}/Cursor/GPUCache/**",
  "${APPDATA}/Cursor/DawnCache/**", "${APPDATA}/Cursor/DawnGraphiteCache/**", "${APPDATA}/Cursor/DawnWebGPUCache/**",
  "${APPDATA}/Cursor/Service Worker/CacheStorage/**", "${APPDATA}/Cursor/logs/**", "${APPDATA}/Cursor/Crashpad/**",
  "${LOCALAPPDATA}/cursor-updater/**",
]
level           = "safe"
regenerates     = true
requires_closed = ["Cursor.exe"]
impact          = "Caches, logs and downloaded updates; rebuilt automatically."
impact_vi       = "Bộ đệm, nhật ký và bản cập nhật đã tải; được tạo lại tự động."
verified_on     = 2026-10-16

[[rule]]
id              = "cursor.local-history"
vendor          = "Anysphere"
app             = "Cursor"
category        = "ai-ide"
platform        = ["windows"]
paths           = ["${APPDATA}/Cursor/User/History/**"]
level           = "caution"
min_age_days    = 30
requires_closed = ["Cursor.exe"]
impact          = "Local History (the file timeline). Per-workspace chats are kept (rule cursor.chats)."
impact_vi       = "Local History (dòng thời gian của tệp). Chat theo workspace được giữ lại (rule cursor.chats)."
verified_on     = 2026-10-16

# ───────────────────────────── Windsurf ─────────────────────────────

[[rule]]
id              = "codeium.windsurf.cascade"
vendor          = "Codeium"
app             = "Windsurf"
category        = "ai-ide"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.codeium/windsurf/cascade/**", "${HOME}/.codeium/windsurf/brain/**", "${APPDATA}/Windsurf/User/workspaceStorage/**", "${APPDATA}/Windsurf/User/globalStorage/**"]
level           = "protected"
impact          = "Cascade (agent) conversations and per-workspace chats. Conversation history is never deleted (PLAN §5.1)."
impact_vi       = "Hội thoại Cascade (agent) và chat theo workspace. Lịch sử hội thoại không bao giờ bị xóa (PLAN §5.1)."
verified_on     = 2026-10-16

[[rule]]
id              = "codeium.windsurf.config"
vendor          = "Codeium"
app             = "Windsurf"
category        = "ai-ide"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.codeium/config.json", "${HOME}/.codeium/windsurf/mcp_config.json", "${HOME}/.codeium/windsurf/memories/**"]
level           = "protected"
impact          = "Config, MCP and memories."
impact_vi       = "Cấu hình, MCP và bộ nhớ."
verified_on     = 2026-10-16

# ───────────────────────────── Local LLM runtimes ─────────────────────────────

[[rule]]
id              = "ollama.models"
vendor          = "Ollama"
app             = "Ollama"
category        = "llm-runtime"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.ollama/models/blobs/**", "${HOME}/.ollama/models/manifests/**"]
level           = "caution"
regenerates     = false
requires_closed = ["ollama.exe", "ollama app.exe", "ollama"]
impact          = "Downloaded models (often tens of GB). You must `ollama pull` again. Prefer removing single models with `ollama rm <name>`."
impact_vi       = "Model đã tải (thường hàng chục GB). Phải `ollama pull` lại. Nên gỡ từng model bằng `ollama rm <tên>`."
docs            = "https://github.com/ollama/ollama"
verified_on     = 2026-10-16

[[rule]]
id              = "ollama.keys"
vendor          = "Ollama"
app             = "Ollama"
category        = "llm-runtime"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.ollama/id_ed25519", "${HOME}/.ollama/id_ed25519.pub"]
level           = "protected"
impact          = "Ollama identity key pair used to push/pull from registries; deleting it breaks authenticated access."
impact_vi       = "Cặp khóa định danh Ollama dùng để push/pull với registry; xóa sẽ hỏng truy cập có xác thực."
verified_on     = 2026-10-16

[[rule]]
id              = "huggingface.hub-cache"
vendor          = "Hugging Face"
app             = "huggingface_hub"
category        = "llm-runtime"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.cache/huggingface/hub/**"]
exclude         = ["${HOME}/.cache/huggingface/token"]
level           = "caution"
regenerates     = false
impact          = "Downloaded models and datasets; re-downloaded on next use."
impact_vi       = "Model và dataset đã tải; được tải lại ở lần dùng sau."
verified_on     = 2026-10-16

[[rule]]
id              = "lmstudio.models"
vendor          = "LM Studio"
app             = "LM Studio"
category        = "llm-runtime"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.lmstudio/models/**", "${HOME}/.cache/lm-studio/models/**"]
level           = "caution"
regenerates     = false
requires_closed = ["LM Studio.exe"]
impact          = "Downloaded GGUF models; re-download required. Conversations are NOT touched."
impact_vi       = "Model GGUF đã tải; phải tải lại. Cuộc hội thoại KHÔNG bị đụng tới."
verified_on     = 2026-10-16

[[rule]]
id              = "lmstudio.conversations"
vendor          = "LM Studio"
app             = "LM Studio"
category        = "llm-runtime"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.lmstudio/conversations/**", "${HOME}/.lmstudio/settings.json"]
level           = "protected"
impact          = "Your chat history and LM Studio settings."
impact_vi       = "Lịch sử chat và thiết lập LM Studio của bạn."
verified_on     = 2026-10-16

[[rule]]
id              = "huggingface.token"
vendor          = "Hugging Face"
app             = "Hugging Face Hub"
category        = "llm-runtime"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.cache/huggingface/token", "${HOME}/.cache/huggingface/stored_tokens"]
level           = "protected"
impact          = "Your Hugging Face access tokens; deleting signs you out of `hf`."
impact_vi       = "Token truy cập Hugging Face; xóa sẽ đăng xuất khỏi `hf`."
verified_on     = 2026-10-16

[[rule]]
id              = "ollama.logs"
vendor          = "Ollama"
app             = "Ollama"
category        = "llm-runtime"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Ollama/*.log"]
level           = "safe"
regenerates     = true
min_age_days    = 1
requires_closed = ["ollama.exe", "ollama app.exe"]
impact          = "Server and app logs of Ollama; models are not touched."
impact_vi       = "Nhật ký server và ứng dụng Ollama; không đụng tới model."
verified_on     = 2026-10-16

[[rule]]
id              = "pytorch.hub-cache"
vendor          = "PyTorch"
app             = "PyTorch Hub"
category        = "ml-cache"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.cache/torch/**"]
level           = "caution"
impact          = "Pretrained weights and repos downloaded by torch.hub / torchvision; downloaded again the next time code asks for them (can be GBs)."
impact_vi       = "Trọng số pretrained và repo do torch.hub / torchvision tải; sẽ tải lại khi mã cần tới (có thể vài GB)."
verified_on     = 2026-10-16

[[rule]]
id              = "google.keras.cache"
vendor          = "Google"
app             = "Keras / TensorFlow"
category        = "ml-cache"
platform        = ["windows", "macos", "linux"]
paths           = ["${HOME}/.keras/datasets/**", "${HOME}/.keras/models/**", "${HOME}/tensorflow_datasets/**"]
level           = "caution"
impact          = "Datasets and model weights downloaded by Keras and TensorFlow Datasets; downloaded again on demand."
impact_vi       = "Dataset và trọng số model do Keras và TensorFlow Datasets tải; sẽ tải lại khi cần."
verified_on     = 2026-10-16

[[rule]]
id              = "janhq.jan.models"
vendor          = "Jan"
app             = "Jan"
category        = "llm-runtime"
platform        = ["windows"]
paths           = ["${APPDATA}/Jan/data/models/**"]
level           = "caution"
requires_closed = ["Jan.exe"]
impact          = "Models downloaded in Jan; download them again from the Hub. Threads (chat history) are kept."
impact_vi       = "Model đã tải trong Jan; tải lại từ Hub. Giữ nguyên thread (lịch sử chat)."
verified_on     = 2026-10-16

[[rule]]
id              = "janhq.jan.threads"
vendor          = "Jan"
app             = "Jan"
category        = "llm-runtime"
platform        = ["windows"]
paths           = ["${APPDATA}/Jan/data/threads/**", "${APPDATA}/Jan/data/assistants/**"]
level           = "protected"
impact          = "Your Jan chat threads and assistants."
impact_vi       = "Thread chat và assistant của bạn trong Jan."
verified_on     = 2026-10-16

[[rule]]
id              = "nomic.gpt4all.models"
vendor          = "Nomic AI"
app             = "GPT4All"
category        = "llm-runtime"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/nomic.ai/GPT4All/*.gguf"]
level           = "caution"
requires_closed = ["chat.exe", "GPT4All.exe"]
impact          = "Downloaded GGUF models of GPT4All; download them again in the app. Chats are kept."
impact_vi       = "Model GGUF đã tải của GPT4All; tải lại trong ứng dụng. Giữ nguyên các cuộc chat."
verified_on     = 2026-10-16

# ───────────────────────────── Agent extensions & CLIs ─────────────────────────────

[[rule]]
id              = "github.copilot-cli.logs"
vendor          = "GitHub"
app             = "Copilot CLI"
category        = "ai-agent"
platform        = ["windows", "macos", "linux"]
