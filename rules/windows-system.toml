# NANOFreeDisk rule pack: Windows system junk
# Everything here is deliberately conservative. Locations such as WinSxS, Installer,
# pagefile/hiberfil, Windows.old and restore points are *protected* — the app explains the
# proper Microsoft tool instead of deleting them.

[pack]
id          = "windows-system"
name        = "Windows system junk"
version     = "0.1.0"
description = "Temp folders, crash dumps, thumbnail caches, old logs and update leftovers on Windows 10/11."

[[rule]]
id              = "windows.temp.user"
vendor          = "Microsoft"
app             = "Windows"
category        = "system"
platform        = ["windows"]
paths           = ["${TEMP}/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
impact          = "Per-user temporary files. Files newer than 24 hours and files locked by a running program are skipped automatically."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.temp.system"
vendor          = "Microsoft"
app             = "Windows"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMROOT}/Temp/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
impact          = "System-wide temporary files (requires administrator). Locked files are skipped."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.explorer.thumbcache"
vendor          = "Microsoft"
app             = "Windows Explorer"
category        = "system"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Microsoft/Windows/Explorer/thumbcache_*.db", "${LOCALAPPDATA}/Microsoft/Windows/Explorer/iconcache_*.db"]
level           = "safe"
regenerates     = true
requires_closed = ["explorer.exe"]
impact          = "Thumbnail and icon caches. Explorer rebuilds them; folders with many pictures show thumbnails slightly slower the first time."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.inetcache"
vendor          = "Microsoft"
app             = "Windows / WebView / legacy IE"
category        = "system"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Microsoft/Windows/INetCache/**", "${LOCALAPPDATA}/Microsoft/Windows/WebCache/*.log"]
level           = "safe"
regenerates     = true
impact          = "Legacy internet cache used by some Windows components and apps."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.crashdumps.user"
vendor          = "Microsoft"
app             = "Windows Error Reporting"
category        = "system"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/CrashDumps/**", "${LOCALAPPDATA}/Microsoft/Windows/WER/ReportArchive/**", "${LOCALAPPDATA}/Microsoft/Windows/WER/ReportQueue/**"]
level           = "safe"
regenerates     = true
impact          = "Application crash dumps and error reports. You lose data useful for debugging a crash you have not reported yet."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.crashdumps.kernel"
vendor          = "Microsoft"
app             = "Windows"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMROOT}/Minidump/**", "${SYSTEMROOT}/MEMORY.DMP", "${SYSTEMROOT}/LiveKernelReports/**"]
level           = "safe"
regenerates     = true
impact          = "Blue-screen memory dumps (requires administrator). Keep them if you still want to analyse a recent BSOD."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.logs.cbs"
vendor          = "Microsoft"
app             = "Windows Servicing"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMROOT}/Logs/CBS/*.log", "${SYSTEMROOT}/Logs/CBS/*.cab", "${SYSTEMROOT}/Logs/DISM/*.log"]
level           = "safe"
regenerates     = true
min_age_days    = 7
impact          = "Component-servicing logs; they can grow to many GB. Current-day logs are kept for troubleshooting."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.update.download-cache"
vendor          = "Microsoft"
app             = "Windows Update"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMROOT}/SoftwareDistribution/Download/**"]
level           = "advanced"
regenerates     = true
requires_closed = ["wuauserv"]
impact          = "Downloaded update packages. Windows Update service must be stopped first; pending updates are downloaded again. Use only when updates are stuck or the folder is huge."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.delivery-optimization.cache"
vendor          = "Microsoft"
app             = "Delivery Optimization"
category        = "system"
platform        = ["windows"]
paths           = ["${PROGRAMDATA}/Microsoft/Windows/DeliveryOptimization/Cache/**"]
level           = "protected"
impact          = "Peer-to-peer update cache. Clear it through Settings → System → Storage → Temporary files → Delivery Optimization Files, which stops the service correctly."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.defender.scan-history"
vendor          = "Microsoft"
app             = "Microsoft Defender"
category        = "system"
platform        = ["windows"]
paths           = ["${PROGRAMDATA}/Microsoft/Windows Defender/Scans/History/**"]
level           = "protected"
impact          = "Defender scan history and quarantine metadata. Managed by Defender itself; clear it from Windows Security → Protection history."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.package-cache"
vendor          = "Microsoft"
app             = "Windows Installer / Burn bundles"
category        = "system"
platform        = ["windows"]
paths           = ["${PROGRAMDATA}/Package Cache/**"]
level           = "protected"
impact          = "Installer cache used to repair or uninstall Visual Studio, VC++ runtimes and .NET. Deleting it breaks repair/uninstall for those products; this app will not touch it."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.winsxs"
vendor          = "Microsoft"
app             = "Windows"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMROOT}/WinSxS/**", "${SYSTEMROOT}/Installer/**", "${SYSTEMROOT}/servicing/**"]
level           = "protected"
impact          = "Component store and installer database. Never delete directly. Reclaim space with: DISM /Online /Cleanup-Image /StartComponentCleanup /ResetBase"
docs            = "https://learn.microsoft.com/windows-hardware/manufacture/desktop/clean-up-the-winsxs-folder"
verified_on     = 2026-10-16

[[rule]]
id              = "windows.pagefile-hiberfil"
vendor          = "Microsoft"
app             = "Windows"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMDRIVE}/pagefile.sys", "${SYSTEMDRIVE}/hiberfil.sys", "${SYSTEMDRIVE}/swapfile.sys"]
level           = "protected"
impact          = "Virtual memory and hibernation files. Disable hibernation with `powercfg /h off` (frees hiberfil.sys) or resize the page file in System → Advanced → Performance."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.old"
vendor          = "Microsoft"
app             = "Windows Setup"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMDRIVE}/Windows.old/**", "${SYSTEMDRIVE}/$WINDOWS.~BT/**", "${SYSTEMDRIVE}/$WINDOWS.~WS/**"]
level           = "protected"
impact          = "Previous Windows installation (needed to roll back an upgrade for 10 days). Remove it with Settings → System → Storage → Temporary files → Previous Windows installation(s)."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.restore-points"
vendor          = "Microsoft"
app             = "System Restore / VSS"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMDRIVE}/System Volume Information/**"]
level           = "protected"
impact          = "Restore points and shadow copies. Manage them in System Protection or with `vssadmin list shadows`."
verified_on     = 2026-10-16

[[rule]]
id              = "windows.prefetch"
vendor          = "Microsoft"
app             = "Windows"
category        = "system"
platform        = ["windows"]
paths           = ["${SYSTEMROOT}/Prefetch/**"]
level           = "protected"
impact          = "Prefetch data makes apps start faster and is tiny. Deleting it only slows the next launches; this app never offers it."
verified_on     = 2026-10-16

[[rule]]
id              = "gpu.nvidia.shader-cache"
vendor          = "NVIDIA"
app             = "GPU driver"
category        = "gpu"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/NVIDIA/DXCache/**", "${LOCALAPPDATA}/NVIDIA/GLCache/**", "${LOCALAPPDATA}/NVIDIA Corporation/NV_Cache/**", "${LOCALAPPDATA}/NVIDIA/OptixCache/**"]
level           = "safe"
regenerates     = true
impact          = "Compiled shader caches. Games and apps recompile shaders on first launch (short stutter once)."
verified_on     = 2026-10-16

[[rule]]
id              = "gpu.amd.shader-cache"
vendor          = "AMD"
app             = "GPU driver"
category        = "gpu"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/AMD/DxCache/**", "${LOCALAPPDATA}/AMD/DxcCache/**", "${LOCALAPPDATA}/AMD/GLCache/**", "${LOCALAPPDATA}/AMD/VkCache/**"]
level           = "safe"
regenerates     = true
impact          = "Compiled shader caches; rebuilt on first launch."
verified_on     = 2026-10-16

[[rule]]
id              = "gpu.intel.shader-cache"
vendor          = "Intel"
app             = "GPU driver"
category        = "gpu"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Intel/ShaderCache/**"]
level           = "safe"
regenerates     = true
impact          = "Compiled shader caches; rebuilt on first launch."
verified_on     = 2026-10-16

[[rule]]
id              = "gpu.d3d.shader-cache"
vendor          = "Microsoft"
app             = "Direct3D"
category        = "gpu"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/D3DSCache/**"]
level           = "safe"
regenerates     = true
impact          = "Direct3D shader cache; rebuilt automatically."
verified_on     = 2026-10-16

[[rule]]
id              = "nvidia.driver-downloads"
vendor          = "NVIDIA"
app             = "NVIDIA App / GeForce Experience"
category        = "system"
platform        = ["windows"]
paths           = ["${PROGRAMDATA}/NVIDIA Corporation/Downloader/**", "${PROGRAMDATA}/NVIDIA Corporation/NV_Cache/**"]
level           = "safe"
regenerates     = true
impact          = "Downloaded driver packages that were already installed."
verified_on     = 2026-10-16
