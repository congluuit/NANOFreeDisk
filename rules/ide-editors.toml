# NANOFreeDisk rule pack: IDEs & editors
# Schema: see docs/DEVTOOL_CACHE_CATALOG.md §2 and crates/nfd-rules/src/lib.rs
# Caches, logs and crash reports are 🟢; workspace state, Local History and hot-exit
# backups are 🟡; settings, keymaps, extensions and keys are 🔴 (listed as "kept").
# Build artifacts inside projects are not rules: see nfd-devtools::artifacts (C9).

[pack]
id          = "ide-editors"
name        = "IDEs & editors"
version     = "0.1.0"
description = "Caches, logs and state of VS Code and its forks, JetBrains IDEs, Visual Studio, Android Studio, Sublime Text, Zed, Neovim, Obsidian, Postman and Docker Desktop."
devcache    = true

# ───────────────────────────── VS Code ─────────────────────────────

[[rule]]
id              = "microsoft.vscode.cache"
vendor          = "Microsoft"
app             = "Visual Studio Code"
category        = "ide"
platform        = ["windows"]
paths           = [
  "${APPDATA}/Code/Cache/**", "${APPDATA}/Code/CachedData/**", "${APPDATA}/Code/CachedExtensionVSIXs/**",
  "${APPDATA}/Code/CachedProfilesData/**", "${APPDATA}/Code/Code Cache/**", "${APPDATA}/Code/GPUCache/**",
  "${APPDATA}/Code/DawnCache/**", "${APPDATA}/Code/DawnGraphiteCache/**", "${APPDATA}/Code/DawnWebGPUCache/**",
  "${APPDATA}/Code/Service Worker/CacheStorage/**", "${APPDATA}/Code/blob_storage/**",
]
level           = "safe"
regenerates     = true
requires_closed = ["Code.exe"]
impact          = "Chromium caches, compiled extension data and downloaded extension packages. VS Code rebuilds them and opens a little slower once."
impact_vi       = "Bộ đệm Chromium, dữ liệu extension đã biên dịch và gói extension đã tải. VS Code tự tạo lại, mở chậm hơn một lần."
docs            = "https://code.visualstudio.com/docs/setup/uninstall#_clean-uninstall"
verified_on     = 2026-10-16

[[rule]]
id              = "microsoft.vscode.logs"
vendor          = "Microsoft"
app             = "Visual Studio Code"
category        = "ide"
platform        = ["windows"]
paths           = ["${APPDATA}/Code/logs/**", "${APPDATA}/Code/Crashpad/completed/**", "${APPDATA}/Code/Crashpad/reports/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
requires_closed = ["Code.exe"]
impact          = "Old logs and crash reports. You only lose material for bug reports."
impact_vi       = "Nhật ký và báo cáo lỗi cũ. Bạn chỉ mất tư liệu để báo lỗi."
verified_on     = 2026-10-16

[[rule]]
id              = "microsoft.vscode.workspace-state"
vendor          = "Microsoft"
app             = "Visual Studio Code"
category        = "ide"
platform        = ["windows"]
paths           = ["${APPDATA}/Code/User/workspaceStorage/**", "${APPDATA}/Code/User/History/**"]
level           = "caution"
min_age_days    = 30
requires_closed = ["Code.exe"]
impact          = "Per-workspace state (open editors, extension data such as AI chats per project) and Local History (the file timeline). Your files are untouched."
impact_vi       = "Trạng thái theo workspace (tab đang mở, dữ liệu extension như chat AI theo dự án) và Local History (dòng thời gian của tệp). Tệp của bạn không bị ảnh hưởng."
verified_on     = 2026-10-16

[[rule]]
id              = "microsoft.vscode.backups"
vendor          = "Microsoft"
app             = "Visual Studio Code"
category        = "ide"
platform        = ["windows"]
paths           = ["${APPDATA}/Code/Backups/**"]
level           = "caution"
min_age_days    = 7
requires_closed = ["Code.exe"]
impact          = "Hot-exit copies of files you never saved. Deleting loses those unsaved edits; only folders older than 7 days are offered."
impact_vi       = "Bản sao hot-exit của tệp bạn chưa từng lưu. Xóa sẽ mất các chỉnh sửa chưa lưu đó; chỉ đề xuất thư mục cũ hơn 7 ngày."
verified_on     = 2026-10-16

[[rule]]
id              = "microsoft.vscode.config"
vendor          = "Microsoft"
app             = "Visual Studio Code"
category        = "ide"
platform        = ["windows"]
paths           = [
  "${APPDATA}/Code/User/settings.json", "${APPDATA}/Code/User/keybindings.json", "${APPDATA}/Code/User/snippets/**",
  "${APPDATA}/Code/User/profiles/**", "${APPDATA}/Code/User/globalStorage/state.vscdb*", "${HOME}/.vscode/extensions/**",
]
level           = "protected"
impact          = "Settings, keybindings, snippets, profiles, global state and installed extensions."
impact_vi       = "Thiết lập, phím tắt, snippet, profile, trạng thái chung và extension đã cài."
verified_on     = 2026-10-16

[[rule]]
id              = "microsoft.vscode.cli-cache"
vendor          = "Microsoft"
app             = "Visual Studio Code"
category        = "ide"
platform        = ["windows"]
paths           = ["${HOME}/.vscode/cli/**"]
level           = "safe"
regenerates     = true
requires_closed = ["code-tunnel.exe", "Code.exe"]
impact          = "Downloaded servers of the `code tunnel` CLI; fetched again the next time you open a tunnel."
impact_vi       = "Server đã tải của CLI `code tunnel`; sẽ được tải lại khi bạn mở tunnel lần sau."
verified_on     = 2026-10-16

# ───────────────────────────── VS Code forks ─────────────────────────────

