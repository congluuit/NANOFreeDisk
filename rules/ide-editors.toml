  "${APPDATA}/Kiro/Cache/**", "${APPDATA}/Kiro/CachedData/**", "${APPDATA}/Kiro/Code Cache/**", "${APPDATA}/Kiro/GPUCache/**",
  "${APPDATA}/Kiro/DawnCache/**", "${APPDATA}/Kiro/Service Worker/CacheStorage/**", "${APPDATA}/Kiro/logs/**",
  "${HOME}/.kiro/logs/**",
]
level           = "safe"
regenerates     = true
requires_closed = ["Kiro.exe"]
impact          = "Editor caches and logs of Kiro; rebuilt automatically. Specs and steering files are kept."
impact_vi       = "Bộ đệm và nhật ký của Kiro; được tạo lại tự động. Giữ nguyên specs và steering."
verified_on     = 2026-10-16

[[rule]]
id              = "aws.kiro.config"
vendor          = "AWS"
app             = "Kiro"
category        = "ai-ide"
platform        = ["windows"]
paths           = ["${APPDATA}/Kiro/User/settings.json", "${HOME}/.kiro/settings/**", "${HOME}/.kiro/specs/**", "${HOME}/.kiro/steering/**"]
level           = "protected"
impact          = "Kiro settings, specs and steering documents you wrote."
impact_vi       = "Thiết lập Kiro, specs và tài liệu steering bạn đã viết."
verified_on     = 2026-10-16

[[rule]]
id              = "bytedance.trae.cache"
vendor          = "ByteDance"
app             = "Trae"
category        = "ai-ide"
platform        = ["windows"]
paths           = [
  "${APPDATA}/Trae/Cache/**", "${APPDATA}/Trae/CachedData/**", "${APPDATA}/Trae/Code Cache/**", "${APPDATA}/Trae/GPUCache/**",
  "${APPDATA}/Trae/DawnCache/**", "${APPDATA}/Trae/Service Worker/CacheStorage/**", "${APPDATA}/Trae/logs/**",
]
level           = "safe"
regenerates     = true
requires_closed = ["Trae.exe"]
impact          = "Editor caches and logs of Trae; rebuilt automatically."
impact_vi       = "Bộ đệm và nhật ký trình soạn thảo của Trae; được tạo lại tự động."
verified_on     = 2026-10-16

# ───────────────────────────── JetBrains ─────────────────────────────

[[rule]]
id              = "jetbrains.caches"
vendor          = "JetBrains"
app             = "JetBrains IDEs"
category        = "ide"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/JetBrains/*/caches/**", "${LOCALAPPDATA}/JetBrains/*/index/**", "${LOCALAPPDATA}/JetBrains/*/jcef_cache/**"]
level           = "safe"
regenerates     = true
requires_closed = ["idea64.exe", "rider64.exe", "pycharm64.exe", "webstorm64.exe", "clion64.exe", "goland64.exe", "phpstorm64.exe", "rustrover64.exe", "datagrip64.exe", "rubymine64.exe"]
impact          = "IDE caches and indexes. The next start re-indexes your projects (minutes on large ones); settings and plugins are kept."
impact_vi       = "Bộ đệm và chỉ mục của IDE. Lần mở sau sẽ lập chỉ mục lại dự án (vài phút với dự án lớn); giữ nguyên thiết lập và plugin."
docs            = "https://www.jetbrains.com/help/idea/directories-used-by-the-ide-to-store-settings-caches-plugins-and-logs.html"
verified_on     = 2026-10-16

[[rule]]
id              = "jetbrains.logs"
vendor          = "JetBrains"
app             = "JetBrains IDEs"
category        = "ide"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/JetBrains/*/log/**", "${LOCALAPPDATA}/JetBrains/*/tmp/**", "${LOCALAPPDATA}/JetBrains/*/compile-server/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
requires_closed = ["idea64.exe", "rider64.exe", "pycharm64.exe", "webstorm64.exe", "clion64.exe", "goland64.exe", "phpstorm64.exe", "rustrover64.exe", "datagrip64.exe", "rubymine64.exe"]
impact          = "Logs, temp files and the build server's caches; the next build is a full one."
impact_vi       = "Nhật ký, tệp tạm và bộ đệm của build server; lần build sau sẽ build lại toàn bộ."
verified_on     = 2026-10-16

[[rule]]
id              = "jetbrains.toolbox.cache"
vendor          = "JetBrains"
app             = "Toolbox App"
category        = "ide"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/JetBrains/Toolbox/cache/**", "${LOCALAPPDATA}/JetBrains/Toolbox/logs/**", "${LOCALAPPDATA}/JetBrains/Toolbox/download/**"]
level           = "safe"
regenerates     = true
requires_closed = ["jetbrains-toolbox.exe"]
impact          = "Toolbox App caches, logs and finished downloads. Installed IDEs are not touched (remove old versions in Toolbox)."
impact_vi       = "Bộ đệm, nhật ký và bản tải xong của Toolbox App. Không đụng IDE đã cài (gỡ bản cũ trong Toolbox)."
verified_on     = 2026-10-16

[[rule]]
id              = "jetbrains.config"
vendor          = "JetBrains"
app             = "JetBrains IDEs"
category        = "ide"
platform        = ["windows"]
paths           = ["${APPDATA}/JetBrains/**", "${LOCALAPPDATA}/JetBrains/Toolbox/apps/**"]
level           = "protected"
impact          = "Settings, keymaps, plugins and the IDEs installed by Toolbox. Uninstall old IDE versions from the Toolbox App."
impact_vi       = "Thiết lập, keymap, plugin và IDE do Toolbox cài. Gỡ phiên bản IDE cũ trong Toolbox App."
verified_on     = 2026-10-16

# ───────────────────────────── Visual Studio ─────────────────────────────

[[rule]]
id              = "microsoft.visualstudio.component-cache"
vendor          = "Microsoft"
app             = "Visual Studio"
category        = "ide"
platform        = ["windows"]
paths           = [
  "${LOCALAPPDATA}/Microsoft/VisualStudio/*/ComponentModelCache/**", "${LOCALAPPDATA}/Microsoft/VisualStudio/*/ImageLibrary/**",
  "${LOCALAPPDATA}/Microsoft/VisualStudio/*/Designer/ShadowCache/**",
]
level           = "safe"
regenerates     = true
requires_closed = ["devenv.exe"]
impact          = "MEF component, image and designer caches; Visual Studio rebuilds them at the next start (the usual fix for broken extensions)."
impact_vi       = "Bộ đệm thành phần MEF, hình ảnh và designer; Visual Studio tạo lại ở lần mở sau (cách sửa thường dùng khi extension lỗi)."
verified_on     = 2026-10-16

[[rule]]
id              = "microsoft.visualstudio.installer-packages"
vendor          = "Microsoft"
app             = "Visual Studio"
category        = "ide"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Microsoft/VisualStudio/Packages/**"]
level           = "advanced"
requires_closed = ["devenv.exe", "setup.exe", "vs_installer.exe"]
impact          = "Installer package cache used to modify or repair Visual Studio. Repairs and new workloads download the packages again."
impact_vi       = "Bộ đệm gói của trình cài đặt dùng để sửa đổi/sửa chữa Visual Studio. Khi sửa hoặc thêm workload sẽ phải tải lại."
verified_on     = 2026-10-16

# ───────────────────────────── Android ─────────────────────────────

[[rule]]
id              = "google.android-studio.caches"
vendor          = "Google"
app             = "Android Studio"
category        = "ide"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Google/AndroidStudio*/caches/**", "${LOCALAPPDATA}/Google/AndroidStudio*/log/**", "${LOCALAPPDATA}/Google/AndroidStudio*/tmp/**"]
level           = "safe"
regenerates     = true
requires_closed = ["studio64.exe"]
impact          = "Android Studio caches, logs and temp files; projects are re-indexed at the next start."
impact_vi       = "Bộ đệm, nhật ký và tệp tạm của Android Studio; dự án được lập chỉ mục lại ở lần mở sau."
verified_on     = 2026-10-16

[[rule]]
id              = "google.android.system-images"
vendor          = "Google"
app             = "Android SDK"
category        = "sdk"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/Android/Sdk/system-images/**"]
level           = "advanced"
requires_closed = ["emulator.exe", "qemu-system-x86_64.exe", "studio64.exe"]
impact          = "Emulator system images (GBs each). Emulators using them stop booting until you download them again in the SDK Manager; prefer `sdkmanager --uninstall`."
impact_vi       = "Image hệ thống của emulator (mỗi cái vài GB). Emulator dùng chúng sẽ không khởi động được cho tới khi tải lại trong SDK Manager; nên dùng `sdkmanager --uninstall`."
verified_on     = 2026-10-16

[[rule]]
id              = "google.android.avd-snapshots"
vendor          = "Google"
app             = "Android Emulator"
category        = "sdk"
platform        = ["windows"]
paths           = ["${HOME}/.android/avd/*.avd/snapshots/**"]
level           = "caution"
requires_closed = ["emulator.exe", "qemu-system-x86_64.exe"]
impact          = "Saved emulator snapshots (quick boot). The next start is a cold boot and in-emulator state since the last boot is lost."
impact_vi       = "Snapshot đã lưu của emulator (quick boot). Lần mở sau phải cold boot và mất trạng thái bên trong emulator từ lần khởi động trước."
verified_on     = 2026-10-16

[[rule]]
id              = "google.android.keys"
vendor          = "Google"
app             = "Android SDK"
category        = "sdk"
platform        = ["windows"]
paths           = ["${HOME}/.android/adbkey", "${HOME}/.android/adbkey.pub", "${HOME}/.android/debug.keystore", "${HOME}/.android/avd/*.avd/config.ini"]
level           = "protected"
impact          = "ADB keys, the debug signing keystore and emulator definitions. Losing the keystore changes your debug app signature."
impact_vi       = "Khóa ADB, keystore ký bản debug và định nghĩa emulator. Mất keystore sẽ đổi chữ ký ứng dụng debug."
verified_on     = 2026-10-16

