impact          = "Installed toolchains, cargo-installed tools, config and registry tokens. Remove old toolchains with `rustup toolchain uninstall` (Toolchains tab)."
impact_vi       = "Toolchain đã cài, công cụ cài bằng cargo, cấu hình và token registry. Gỡ toolchain cũ bằng `rustup toolchain uninstall` (tab Toolchain)."
verified_on     = 2026-10-16

