regenerates     = true
requires_closed = ["rustup.exe"]
impact          = "Partial and finished toolchain downloads left by rustup."
impact_vi       = "Bản tải toolchain dở dang hoặc đã xong mà rustup để lại."
verified_on     = 2026-10-16

[[rule]]
id              = "rust.keep"
vendor          = "Rust"
app             = "rustup"
category        = "toolchain"
platform        = ["windows"]
paths           = ["${HOME}/.rustup/toolchains/**", "${HOME}/.rustup/settings.toml", "${HOME}/.cargo/bin/**", "${HOME}/.cargo/config.toml", "${HOME}/.cargo/credentials.toml"]
