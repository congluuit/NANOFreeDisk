level           = "safe"
regenerates     = true
requires_closed = ["Code.exe", "devenv.exe"]
impact          = "Type definitions the TypeScript language service downloads for editors (automatic type acquisition); downloaded again on demand."
impact_vi       = "Định nghĩa kiểu mà TypeScript tự tải cho trình soạn thảo (automatic type acquisition); sẽ tải lại khi cần."
verified_on     = 2026-10-16

[[rule]]
