# NANOFreeDisk rule pack: package managers & toolchain caches
# Schema: see docs/DEVTOOL_CACHE_CATALOG.md §3 and crates/nfd-rules/src/lib.rs
# Download caches that the tool fills again by itself are 🟢; stores that projects link
# into or that are slow to rebuild are 🟡 (the DevCache view also offers the tool's own
# cleanup command, nfd-devtools::stores). Installed tools, toolchains, environments,
# credentials and config are 🔴: remove toolchains with their own uninstaller.

[pack]
id          = "package-managers"
name        = "Package managers & toolchains"
version     = "0.1.0"
description = "Download caches and stores of npm, pnpm, Yarn, Bun, Deno, pip, uv, Poetry, Conda, Cargo, rustup, Go, NuGet, .NET, Gradle, Maven, Composer, Scoop, Chocolatey, winget, vcpkg, Dart/Flutter, Playwright and Electron."
devcache    = true

# ───────────────────────────── JavaScript ─────────────────────────────

[[rule]]
id              = "npm.cache"
vendor          = "npm"
app             = "npm"
category        = "package-manager"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/npm-cache/_cacache/**", "${LOCALAPPDATA}/npm-cache/_npx/**", "${LOCALAPPDATA}/npm-cache/_logs/**"]
level           = "safe"
regenerates     = true
min_age_days    = 1
impact          = "npm's download cache, npx packages and logs. Packages are downloaded again on the next install (same as `npm cache clean --force`)."
impact_vi       = "Bộ đệm tải về của npm, gói npx và nhật ký. Gói sẽ được tải lại ở lần cài sau (giống `npm cache clean --force`)."
docs            = "https://docs.npmjs.com/cli/commands/npm-cache"
verified_on     = 2026-10-16

[[rule]]
id              = "pnpm.store"
vendor          = "pnpm"
app             = "pnpm"
category        = "package-manager"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/pnpm/store/**"]
level           = "caution"
requires_closed = ["pnpm.exe"]
impact          = "The content-addressable store your projects' node_modules hard-link into. Little space is freed while projects still link to it, and every project needs `pnpm install` again; prefer `pnpm store prune`."
impact_vi       = "Kho nội dung mà node_modules của các dự án hard-link vào. Giải phóng được ít khi dự án vẫn link tới nó, và mọi dự án phải `pnpm install` lại; nên dùng `pnpm store prune`."
docs            = "https://pnpm.io/cli/store"
verified_on     = 2026-10-16

[[rule]]
id              = "pnpm.metadata-cache"
vendor          = "pnpm"
app             = "pnpm"
category        = "package-manager"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/pnpm-cache/**"]
level           = "safe"
regenerates     = true
impact          = "Registry metadata cached by pnpm; fetched again on the next install."
impact_vi       = "Metadata registry mà pnpm lưu đệm; được tải lại ở lần cài sau."
verified_on     = 2026-10-16

