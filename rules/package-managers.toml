impact          = "Prebuilt binary packages and downloads of vcpkg. The next install builds C++ libraries from source again (can take long)."
impact_vi       = "Gói nhị phân dựng sẵn và bản tải của vcpkg. Lần cài sau phải build lại thư viện C++ từ mã nguồn (có thể lâu)."
verified_on     = 2026-10-16

