vendor          = "Deno"
app             = "Deno"
category        = "package-manager"
platform        = ["windows"]
paths           = ["${LOCALAPPDATA}/deno/deps/**", "${LOCALAPPDATA}/deno/gen/**", "${LOCALAPPDATA}/deno/npm/**", "${LOCALAPPDATA}/deno/remote/**", "${LOCALAPPDATA}/deno/registries/**"]
