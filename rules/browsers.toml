# NANOFreeDisk rule pack: web browser caches
# Only caches that every browser rebuilds by itself: the HTTP cache, compiled JavaScript
# (Code Cache), GPU/shader caches and Service Worker CacheStorage. Never cookies,
# history, saved passwords (Login Data), bookmarks, Local Storage, IndexedDB, sessions
# or extensions — and never a whole profile. A running browser keeps its cache locked:
# close it first or the locked files are skipped.

[pack]
id          = "browsers"
name        = "Web browser caches"
version     = "0.1.0"
description = "HTTP, code, GPU and Service Worker caches of Chrome, Edge, Brave, Vivaldi, Opera and Firefox on Windows."

[[rule]]
id              = "browser.chrome.cache"
vendor          = "Google"
app             = "Chrome"
category        = "browser"
platform        = ["windows"]
paths           = [
  "${LOCALAPPDATA}/Google/Chrome/User Data/*/Cache/**",
  "${LOCALAPPDATA}/Google/Chrome/User Data/*/Code Cache/**",
  "${LOCALAPPDATA}/Google/Chrome/User Data/*/GPUCache/**",
  "${LOCALAPPDATA}/Google/Chrome/User Data/*/Service Worker/CacheStorage/**",
  "${LOCALAPPDATA}/Google/Chrome/User Data/ShaderCache/**",
  "${LOCALAPPDATA}/Google/Chrome/User Data/GrShaderCache/**",
]
level           = "safe"
regenerates     = true
requires_closed = ["chrome.exe"]
impact          = "Cached web pages, scripts and images. Sites load a little slower the first time; you stay signed in and keep history, passwords and bookmarks."
impact_vi       = "Bộ đệm trang web, script và hình ảnh. Trang web tải chậm hơn một chút ở lần đầu; bạn vẫn đăng nhập và giữ nguyên lịch sử, mật khẩu, dấu trang."
verified_on     = 2026-10-16

