# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Every ignore below is reachable ONLY through Tauri's own dependency tree and
# has no fix we can take while the MSRV is 1.85 (Tauri is pinned to 2.11.x for
# the same reason). None of these crates is used directly by our code. Re-check
# each one whenever Tauri or the MSRV is bumped: delete the entry once
# `cargo deny check advisories` passes without it.
ignore = [
  # time < 0.3.47: stack exhaustion when parsing deeply nested format
  # descriptions. Pulled in by cookie/plist/tauri-codegen; we never parse
  # untrusted format descriptions. Fixed in time 0.3.47, which needs Rust 1.88.
  { id = "RUSTSEC-2026-0009", reason = "time via tauri/plist/cookie; fix needs Rust 1.88 > MSRV 1.85" },
  # quick-xml 0.38 DoS (quadratic attribute check, unbounded NsReader
  # namespaces). Only reached through plist 1.8 (tauri-utils/tauri-codegen),
  # which reads our own bundled Info.plist / config at build time, never
  # untrusted XML. plist 1.9 drops quick-xml but needs Rust 1.88.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist 1.8 (tauri); plist 1.9 needs Rust 1.88 > MSRV 1.85" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist 1.8 (tauri); plist 1.9 needs Rust 1.88 > MSRV 1.85" },
  # Unmaintained (no vulnerability): proc-macro-error via glib-macros/gtk3-macros
  # (gtk-rs 0.18, Linux webview stack used by tao/wry/muda). No safe upgrade.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained; proc-macro-error via gtk-rs 0.18 (tauri Linux runtime), no upgrade available" },
  # Unmaintained (no vulnerability): rust-unic crates via urlpattern 0.3 in
  # tauri-utils. No safe upgrade.
  { id = "RUSTSEC-2025-0075", reason = "unmaintained; unic-char-range via urlpattern (tauri-utils), no upgrade available" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained; unic-common via urlpattern (tauri-utils), no upgrade available" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained; unic-char-property via urlpattern (tauri-utils), no upgrade available" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained; unic-ucd-version via urlpattern (tauri-utils), no upgrade available" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained; unic-ucd-ident via urlpattern (tauri-utils), no upgrade available" },
  # Unmaintained (no vulnerability): ttf-parser via ab_glyph/epaint in the branded
  # setup (egui 0.32, the last release for Rust 1.85). It only parses Segoe UI and
  # other fonts from C:\Windows\Fonts, never untrusted files.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained; ttf-parser via egui 0.32 (setup), newer egui needs Rust 1.88 > MSRV 1.85" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # never pull in the old, unmaintained bindings
  # Our code uses `windows-sys`. Tauri's runtime still reaches winapi through
  # dlopen2 (tao, Windows), gio-sys (GTK, Linux) and libloading (libappindicator for
  # the tray icon, Linux), and eframe (the branded setup's egui shell) uses it on
  # Windows; only those may pull it in.
  { crate = "winapi", wrappers = ["dlopen2", "gio-sys", "libloading", "eframe"], reason = "use the `windows` / `windows-sys` crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
