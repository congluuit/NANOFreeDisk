<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="NANOFreeDisk banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M300 0V320M600 0V320M900 0V320"/>
  </g>
  <!-- treemap glyph -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="110" height="180" rx="8" fill="#22D3EE" opacity="0.9"/>
    <rect x="118" y="0" width="80" height="100" rx="8" fill="#A3E635" opacity="0.9"/>
    <rect x="118" y="108" width="80" height="72" rx="8" fill="#F59E0B" opacity="0.9"/>
    <rect x="206" y="0" width="44" height="60" rx="6" fill="#60A5FA" opacity="0.9"/>
    <rect x="206" y="68" width="44" height="40" rx="6" fill="#F472B6" opacity="0.9"/>
    <rect x="206" y="116" width="44" height="64" rx="6" fill="#94A3B8" opacity="0.7"/>
    <!-- magnifier -->
    <circle cx="190" cy="150" r="46" fill="none" stroke="#FFFFFF" stroke-width="10" filter="url(#glow)"/>
    <path d="M224 184L262 222" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <!-- title -->
  <text x="400" y="128" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">NANO<tspan fill="url(#accent)">FreeDisk</tspan></text>
  <text x="402" y="172" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#CBD5E1">Disk analyzer · junk &amp; duplicate cleaner · dev-cache manager · live I/O monitor · drive health</text>
  <text x="402" y="206" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8">Rust · Windows first · macOS &amp; Linux later · open source · never deletes what Windows or your tools need</text>
  <!-- pills -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="402" y="236" width="104" height="32" rx="16" fill="#22D3EE" opacity="0.15" stroke="#22D3EE"/>
    <text x="454" y="257" text-anchor="middle" fill="#22D3EE">Analyze</text>
    <rect x="516" y="236" width="88" height="32" rx="16" fill="#A3E635" opacity="0.15" stroke="#A3E635"/>
    <text x="560" y="257" text-anchor="middle" fill="#A3E635">Clean</text>
    <rect x="614" y="236" width="116" height="32" rx="16" fill="#F59E0B" opacity="0.15" stroke="#F59E0B"/>
    <text x="672" y="257" text-anchor="middle" fill="#F59E0B">DevCache</text>
    <rect x="740" y="236" width="104" height="32" rx="16" fill="#60A5FA" opacity="0.15" stroke="#60A5FA"/>
    <text x="792" y="257" text-anchor="middle" fill="#60A5FA">Monitor</text>
    <rect x="854" y="236" width="96" height="32" rx="16" fill="#F472B6" opacity="0.15" stroke="#F472B6"/>
    <text x="902" y="257" text-anchor="middle" fill="#F472B6">Health</text>
  </g>
  <text x="1170" y="300" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#64748B">nanodev.io.vn</text>
</svg>
