[package]
name = "nfd-apps"
description = "NANOFreeDisk Programs: installed programs, the vendors' uninstallers, leftovers after uninstalling, and software junk (logs, caches, crash dumps, old updates)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nfd-core = { workspace = true }
nfd-platform = { workspace = true }
nfd-rules = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
nfd-tasks = { workspace = true }
# program icons → PNG (the version the branded setup already uses)
png = "0.17"
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
