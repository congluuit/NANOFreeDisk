[workspace]
resolver = "3"
members = ["crates/*", "apps/nfd-cli", "apps/nanofreedisk/src-tauri", "apps/nanofreedisk-setup"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Lưu Đức Thành Công (NANO) <https://nanodev.io.vn/>"]
repository = "https://github.com/congluuit/NANOFreeDisk"
homepage = "https://nanodev.io.vn/"
keywords = ["disk", "analyzer", "cleaner", "windows", "smart"]
categories = ["filesystem", "command-line-utilities"]

[workspace.dependencies]
# internal
# (versions keep cargo-deny's wildcard ban happy; bump them with the workspace version)
nfd-core = { path = "crates/nfd-core", version = "0.2.0" }
nfd-rules = { path = "crates/nfd-rules", version = "0.2.0" }
nfd-platform = { path = "crates/nfd-platform", version = "0.2.0" }
nfd-history = { path = "crates/nfd-history", version = "0.2.0" }
nfd-hwinfo = { path = "crates/nfd-hwinfo", version = "0.2.0" }
nfd-sensors = { path = "crates/nfd-sensors", version = "0.2.0" }
nfd-tasks = { path = "crates/nfd-tasks", version = "0.2.0" }
nfd-helper = { path = "crates/nfd-helper", version = "0.2.0" }
nfd-devtools = { path = "crates/nfd-devtools", version = "0.2.0" }
nfd-dupes = { path = "crates/nfd-dupes", version = "0.2.0" }
nfd-monitor = { path = "crates/nfd-monitor", version = "0.2.0" }
nfd-health = { path = "crates/nfd-health", version = "0.2.0" }
nfd-browsers = { path = "crates/nfd-browsers", version = "0.2.0" }
nfd-advice = { path = "crates/nfd-advice", version = "0.2.0" }
nfd-apps = { path = "crates/nfd-apps", version = "0.2.0" }

# external
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde_json = "1"
rayon = "1"
blake3 = "1.8"
globset = { version = "0.4", default-features = false }
indicatif = "0.18"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
# SQLite compiled in (no system library); 0.40 is the newest that builds on MSRV 1.85
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# macOS: syscalls (getfsstat, getattrlist, clonefile) and NSFileManager for the Trash —
# the same versions Tauri already links on macOS
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_System_RestartManager",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 1
