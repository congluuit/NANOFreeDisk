name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "!docs/DEVTOOL_CACHE_CATALOG.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app links WebKitGTK on Linux; it is linted and tested on Windows.
      - run: cargo clippy --workspace --all-targets --all-features ${{ matrix.os != 'windows-latest' && '--exclude nanofreedisk' || '' }} -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --no-fail-fast --workspace --all-features ${{ matrix.os != 'windows-latest' && '--exclude nanofreedisk' || '' }}
      - run: cargo test --workspace --doc ${{ matrix.os != 'windows-latest' && '--exclude nanofreedisk' || '' }}

  rules:
    name: validate rule packs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p nfd-cli -- rules validate ./rules
      # PHASE3_CLEAN DoD: a whole-system dry run never proposes anything protected
      - name: clean dry run proposes nothing protected
        shell: pwsh
        run: |
          cargo run -q -p nfd-cli -- clean --level advanced --dry-run --json | Out-File -Encoding utf8 clean.json
          $d = Get-Content clean.json -Raw | ConvertFrom-Json
          if ($d.schema -ne 'nanofreedisk.clean.v1') { throw "unexpected schema $($d.schema)" }
          $bad = @($d.items | Where-Object { $_.level -eq 'protected' })
          if ($bad.Count -gt 0) { $bad | Format-List; throw "protected items proposed" }
          "$($d.items.Count) item(s), none protected"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run cargo-deny on the runner rather than in cargo-deny-action's musl
      # container: that container only ships a fixed toolchain and fails on our
      # rust-toolchain.toml override ("stable-x86_64-unknown-linux-musl is not
      # installed"). Advisory ignores and their reasons live in deny.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  msrv:
    name: MSRV (1.85)
    # Windows so the desktop app (Tauri) is checked too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  frontend:
    name: desktop UI (svelte-check, tests, locales, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nanofreedisk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/nanofreedisk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node ../../scripts/check-locales.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  docs-links:
    name: markdown links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --exclude 'localhost' --exclude 'nanodev.io.vn' README.md CONTRIBUTING.md SECURITY.md docs/
          fail: false

  # Gate job for branch protection: require only this one.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, rules, deny, msrv, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
