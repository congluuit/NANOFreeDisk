name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "!docs/DEVTOOL_CACHE_CATALOG.md"
  pull_request:
  # a manual run also builds the macOS app (job macos-app) and keeps it as an artifact
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # NANOFreeDisk ships for Windows and macOS (docs/MACOS.md): lint and test on both.
  # Linux is not a target.
  clippy:
    name: clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --no-fail-fast --workspace --all-features
      - run: cargo test --workspace --doc

  macos:
    name: clippy + test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --no-fail-fast --workspace --all-features
      - run: cargo test --workspace --doc
      # the macOS rule packs never propose anything protected either
      - name: clean dry run proposes nothing protected
        run: |
          cargo run -q -p nfd-cli -- clean --level advanced --dry-run --json > clean.json
          jq -e '.schema == "nanofreedisk.clean.v1"' clean.json
          jq -e '[.items[] | select(.level == "protected")] | length == 0' clean.json
          echo "$(jq '.items | length' clean.json) item(s), none protected"

  macos-app:
    name: build macOS app (universal)
    # manual runs only (Actions → CI → Run workflow): the .dmg and the zipped .app
    # are kept as the run's artifact; tagged releases build them in release.yml
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/nanofreedisk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/nanofreedisk
      - name: Build the universal app
        run: |
          VERSION=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          ./scripts/build-macos.sh dist "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: NANOFreeDisk-macos-universal
          path: dist/*
          if-no-files-found: error

  rules:
    name: validate rule packs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p nfd-cli -- rules validate ./rules
      # PHASE3_CLEAN DoD: a whole-system dry run never proposes anything protected
      - name: clean dry run proposes nothing protected
        shell: pwsh
        run: |
          cargo run -q -p nfd-cli -- clean --level advanced --dry-run --json | Out-File -Encoding utf8 clean.json
          $d = Get-Content clean.json -Raw | ConvertFrom-Json
          if ($d.schema -ne 'nanofreedisk.clean.v1') { throw "unexpected schema $($d.schema)" }
          $bad = @($d.items | Where-Object { $_.level -eq 'protected' })
          if ($bad.Count -gt 0) { $bad | Format-List; throw "protected items proposed" }
          "$($d.items.Count) item(s), none protected"
      # docs/UNINSTALLER.md: the program list and the software junk dry run on a real
      # machine, then a whole uninstall of a throw-away per-user program — its own
      # uninstaller runs, the leftovers (install folder, data folder, registry key,
      # Run entry) are removed, and the Activity log puts them all back
      - name: programs, software junk, uninstall + leftovers + restore
        shell: pwsh
        run: |
          cargo build -q -p nfd-cli
          $nfd = "target/debug/nfd.exe"
          $l = & $nfd programs --store --json | ConvertFrom-Json
          if ($l.schema -ne 'nanofreedisk.programs.v1') { throw "unexpected schema $($l.schema)" }
          $l.programs | Select-Object -First 12 name, size, scope, source, caution | Format-Table | Out-String -Width 200
          if (@($l.programs).Count -lt 3) { throw "too few programs: $(@($l.programs).Count)" }
          $j = & $nfd programs junk --caution --json | ConvertFrom-Json
          $outside = @($j.plan.items | Where-Object { -not $_.path.StartsWith($env:USERPROFILE, 'OrdinalIgnoreCase') })
          if ($outside.Count) { $outside | Format-List; throw "software junk outside the user profile" }
          "$(@($j.plan.items).Count) software junk item(s), all in the user profile"
          $app = "$env:LOCALAPPDATA\Programs\NfdCiApp"
          $data = "$env:APPDATA\NfdCiApp"
          New-Item -ItemType Directory -Force $app, $data | Out-Null
          Set-Content "$app\NfdCiApp.exe" "x"
          Set-Content "$app\settings.ini" "keep me"
          Set-Content "$data\config.json" "{}"
          Set-Content "$app\uninstall.cmd" "@echo off`r`ndel /q `"%~dp0NfdCiApp.exe`"`r`nreg delete `"HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\NfdCiApp`" /f`r`n"
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NfdCiApp'
          New-Item -Force $arp | Out-Null
          New-ItemProperty $arp DisplayName -Value 'NfdCiApp' | Out-Null
          New-ItemProperty $arp Publisher -Value 'NFD CI' | Out-Null
          New-ItemProperty $arp InstallLocation -Value $app | Out-Null
          New-ItemProperty $arp UninstallString -Value "`"$app\uninstall.cmd`"" | Out-Null
          New-Item -Force 'HKCU:\Software\NfdCiApp' | Out-Null
          New-ItemProperty 'HKCU:\Software\NfdCiApp' Theme -Value 'dark' | Out-Null
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not (Test-Path $run)) { New-Item $run | Out-Null }
          New-ItemProperty $run NfdCiApp -Value "`"$app\NfdCiApp.exe`" --tray" -Force | Out-Null
          $u = & $nfd programs uninstall NfdCiApp --remove-leftovers -y --json | ConvertFrom-Json
          $u.operation.items | Select-Object status, mode, reason, path | Format-Table -AutoSize | Out-String -Width 300
          if (@($u.operation.items).Count -lt 4) { throw "expected 4 leftovers (install folder, data folder, key, Run entry)" }
          if (@($u.operation.items | Where-Object { $_.path -match '/' }).Count) { throw "a path mixes separators" }
          if (Test-Path $app) { throw "install folder left behind" }
          if (Test-Path $data) { throw "data folder left behind" }
          if (Test-Path 'HKCU:\Software\NfdCiApp') { throw "registry key left behind" }
          if ((Get-ItemProperty $run).NfdCiApp) { throw "Run entry left behind" }
          & $nfd quarantine restore $u.operation.id
          if (-not (Test-Path "$app\settings.ini")) { throw "install folder not restored" }
          if (-not (Test-Path "$data\config.json")) { throw "data folder not restored" }
          if ((Get-ItemProperty 'HKCU:\Software\NfdCiApp').Theme -ne 'dark') { throw "registry key not restored" }
          if (-not (Get-ItemProperty $run).NfdCiApp) { throw "Run entry not restored" }
          Remove-Item -Recurse -Force $app, $data, 'HKCU:\Software\NfdCiApp'
          Remove-ItemProperty $run NfdCiApp
          "uninstall, leftovers and restore: OK"

  etw:
    name: ETW monitor session (elevated runner)
    # GitHub's Windows runners are elevated: the monitor's real kernel trace session
    # (docs/PHASE6_MONITOR.md) is exercised here, not only on admin dev machines.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nfd-monitor --test etw_live -- --nocapture
      - name: nfd monitor --source etw
        shell: pwsh
        run: |
          cargo run -q -p nfd-cli -- monitor --source etw --seconds 3 --json | Out-File -Encoding utf8 monitor.jsonl
          $lines = Get-Content monitor.jsonl | Where-Object { $_ }
          $last = $lines[-1] | ConvertFrom-Json
          if ($last.schema -ne 'nanofreedisk.monitor.v1') { throw "unexpected schema $($last.schema)" }
          if ($last.source -ne 'etw') { throw "source is $($last.source)" }
          "$($lines.Count) sample(s); last: $($last.processes.Count) process(es), $($last.files.Count) file(s), lost $($last.lost), undecoded $($last.undecoded)"
          if (logman query -ets | Select-String 'NANOFreeDisk') { throw 'trace session left running' }
      # PHASE6 DoD: < 2 % CPU, measured with a light write workload (release build)
      - run: cargo build --release -p nfd-cli
      - name: monitor overhead (ETW)
        shell: pwsh
        run: ./scripts/monitor-overhead.ps1 -Source etw -Seconds 30
      - name: monitor overhead (I/O counters)
        shell: pwsh
        run: ./scripts/monitor-overhead.ps1 -Source counters -Seconds 30

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run cargo-deny on the runner rather than in cargo-deny-action's musl
      # container: that container only ships a fixed toolchain and fails on our
      # rust-toolchain.toml override ("stable-x86_64-unknown-linux-musl is not
      # installed"). Advisory ignores and their reasons live in deny.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  msrv:
    name: MSRV (1.85)
    # Windows so the desktop app (Tauri) is checked too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  frontend:
    name: desktop UI (svelte-check, tests, locales, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nanofreedisk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/nanofreedisk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node ../../scripts/check-locales.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  docs-links:
    name: markdown links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --exclude 'localhost' --exclude 'nanodev.io.vn' README.md CONTRIBUTING.md SECURITY.md docs/
          fail: false

  # Gate job for branch protection: require only this one.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, macos, rules, etw, deny, msrv, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
