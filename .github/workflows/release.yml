name: Release

# Pushing a semver tag (v1.2.3, v1.2.3-rc.1) builds, checks and publishes a release.
# workflow_dispatch builds the four packages and runs the smoke test from any ref;
# with dry_run (the default) it creates no tag, no GitHub Release and no winget PR.
# See docs/PHASE8_INSTALLERS.md section 2.6.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0 (empty = the selected branch)"
        required: false
        default: ""
      dry_run:
        description: "Build and smoke-test only: no GitHub Release, no winget"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  APP_NAME: NANOFreeDisk
  # tag push: always a real release; manual run: only when dry_run is unticked
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. release-check — refuse to ship if anything is inconsistent
  # ─────────────────────────────────────────────────────────────
  release-check:
    name: release-check
    # Windows only, like CI: NANOFreeDisk is not built for macOS / Linux.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive version
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" == v[0-9]* ]]; then
            VERSION="${TAG#v}"
          elif [[ "$DRY_RUN" == "true" ]]; then
            # dry run from a branch: the workspace version
            VERSION=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          else
            echo "::error::a release needs a v* tag (got '$TAG')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Building $VERSION (dry run: $DRY_RUN)"

      - name: Workspace version must match
        shell: bash
        run: |
          WS=$(grep -m1 -E '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Cargo.toml workspace.package.version = $WS"
          [[ "$WS" == "${{ steps.ver.outputs.version }}" ]] || { echo "::error::Cargo.toml version ($WS) != tag (${{ steps.ver.outputs.version }})"; exit 1; }

      - name: tauri.conf.json / package.json versions must match
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          TV=$(jq -r .version apps/nanofreedisk/src-tauri/tauri.conf.json)
          [[ "$TV" == "$V" ]] || { echo "::error::tauri.conf.json version ($TV) != $V"; exit 1; }
          PV=$(jq -r .version apps/nanofreedisk/package.json)
          [[ "$PV" == "$V" ]] || { echo "::error::package.json version ($PV) != $V"; exit 1; }

      - name: CHANGELOG must contain an entry for this version
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          if grep -qE "^## \[$V\]" CHANGELOG.md; then exit 0; fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::CHANGELOG.md has no '## [$V]' section yet (allowed in a dry run)"
          else
            echo "::error::CHANGELOG.md has no '## [$V]' section"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,nextest

      - name: fmt / clippy / tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo nextest run --workspace --all-features

      - name: Rule packs validate
        run: cargo run -p nfd-cli -- rules validate ./rules

      # Blocking. Same policy as CI: deny.toml lists the few Tauri-only
      # advisories we cannot fix under MSRV 1.85, each with its reason.
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --all-features check || { echo "::error::cargo deny reported problems"; exit 1; }

  # ─────────────────────────────────────────────────────────────
  # 2. build-windows — the four packages, signing, smoke test
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: build (windows x64)
    needs: release-check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release-check.outputs.version }}
      # secrets cannot be tested in `if:` directly; these flags can
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      UPDATER_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/nanofreedisk/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: apps/nanofreedisk
        run: pnpm install --frozen-lockfile

      # MSI + NSIS (Tauri), branded setup (egui), portable zip; updater .sig files
      # only when TAURI_SIGNING_PRIVATE_KEY exists.
      - name: Build the four packages
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-packages.ps1 -Out dist -Version $env:VERSION

      # ── Code signing (SignPath Foundation). Skipped cleanly until the project is
      #    approved and SIGNPATH_API_TOKEN + vars.SIGNPATH_ORGANIZATION_ID exist. ──
      - name: Code signing skipped
        if: env.SIGNPATH_ENABLED != 'true'
        shell: bash
        run: echo "::notice::SignPath is not configured — packages stay unsigned (verify with SHA256SUMS.txt)."
      - name: Upload unsigned packages for signing
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-x64
          path: |
            dist/*.exe
            dist/*.msi
      - name: Sign with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nanofreedisk
          signing-policy-slug: ${{ env.DRY_RUN == 'true' && 'test-signing' || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed packages
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Copy-Item dist-signed/* dist/ -Force
          # the updater signature must cover the Authenticode-signed bytes
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Push-Location apps/nanofreedisk
            foreach ($f in Get-ChildItem ../../dist -Include *-x64-setup.exe, *-x64.msi -Recurse) {
              Remove-Item "$($f.FullName).sig" -ErrorAction SilentlyContinue
              pnpm tauri signer sign $f.FullName
            }
            Pop-Location
          }

      - name: Smoke test (install -> start -> uninstall, nothing left behind)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Dist dist -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3. publish — checksums, SBOM, latest.json, changelog, GitHub Release
  # ─────────────────────────────────────────────────────────────
  publish:
    name: publish release
    needs: [release-check, build-windows]
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-check.outputs.version }}
      MINISIGN_ENABLED: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          # not the unsigned copies uploaded for SignPath
          find artifacts/windows-x64 -type f -exec cp {} dist/ \;
          ls -la dist

      - name: SBOM (CycloneDX)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename sbom && cp sbom.cdx.json dist/sbom-$VERSION.cdx.json || true

      - name: Changelog for this version
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Tauri updater manifest (only when the packages carry updater signatures)
      - name: latest.json
        run: node scripts/latest-json.mjs dist "$VERSION" "${{ github.repository }}" RELEASE_NOTES.md

      - name: Checksums
        working-directory: dist
        run: sha256sum $(ls | grep -v -E '\.sig$') > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Sign checksums (minisign, optional)
        if: env.MINISIGN_ENABLED == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s' "$MINISIGN_KEY" > minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m dist/SHA256SUMS.txt -t "NANOFreeDisk $VERSION"
          rm -f minisign.key

      - name: Release notes
        run: |
          {
            echo "## NANOFreeDisk $VERSION"
            echo
            echo "| Package | File |"
            echo "|---|---|"
            for f in dist/*; do b=$(basename "$f"); case "$b" in *.sig) continue;; esac; echo "| \`$b\` | [download](https://github.com/${{ github.repository }}/releases/download/v$VERSION/$b) |"; done
            echo
            echo "★ \`NANOFreeDisk-Setup-$VERSION-x64.exe\` is the recommended installer. Verify any file with \`SHA256SUMS.txt\` (and \`SHA256SUMS.txt.minisig\` when present)."
            echo
            cat RELEASE_NOTES.md 2>/dev/null || true
          } > NOTES.md
          cat NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: NANOFreeDisk ${{ env.VERSION }}
          body_path: NOTES.md
          prerelease: ${{ needs.release-check.outputs.prerelease }}
          draft: false
          files: dist/*
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────
  # 4. post-release — winget manifest PR (after v1.0 and a WINGET_TOKEN)
  # ─────────────────────────────────────────────────────────────
  winget:
    name: winget manifest
    needs: [release-check, publish]
    if: ${{ needs.release-check.outputs.prerelease == 'false' }}
    runs-on: windows-latest
    env:
      WINGET_ENABLED: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Publish to winget
        if: env.WINGET_ENABLED == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NANODev.NANOFreeDisk
          installers-regex: 'NANOFreeDisk-[0-9.]+(-[a-z0-9.]+)?-x64\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
