[package]
name = "nanofreedisk"
description = "NANOFreeDisk desktop app (Tauri 2 + Svelte 5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "nanofreedisk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nfd-core = { workspace = true }
nfd-devtools = { workspace = true }
nfd-dupes = { workspace = true }
nfd-health = { workspace = true }
nfd-history = { workspace = true }
nfd-hwinfo = { workspace = true }
nfd-helper = { workspace = true }
nfd-monitor = { workspace = true }
nfd-sensors = { workspace = true }
nfd-tasks = { workspace = true }
nfd-platform = { workspace = true }
nfd-rules = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# without "zip": updates are the signed .exe / .msi themselves (createUpdaterArtifacts
# = true, not the v1 .zip bundles), so the zip / tar / flate2 extractors are not
# needed — and zip 4.x carries RUSTSEC-2026-0367/0368/0369 with no 2.x updater fix
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
